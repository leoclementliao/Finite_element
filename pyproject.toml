[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fem-project"
version = "0.1.0"
description = "Finite Element Analysis Project"
requires-python = ">=3.8"
dependencies = [
    "numpy>=1.20",
    "matplotlib>=3.5",
    "scipy>=1.7",
    "pytest>=7.0"
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["src"]
python_files = ["test_*.py"]
addopts = "-v --import-mode=importlib"

[project.optional-dependencies]
dev = [
    "black>=22.0",
    "isort>=5.0",
    "flake8>=4.0",
] 